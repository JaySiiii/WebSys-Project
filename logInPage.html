<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>The Box Cinema | Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="./images/n321bu0os3ttasqngb495pqd6e.png">
</head>
<body>
<header>
    <nav class="navigation_bar">
        <a class="logo-link" href="homePage.html">
            <img src="./images/n321bu0os3ttasqngb495pqd6e.png" alt="The Box Cinema Logo">
        </a>
        <a id="home-link" href="homePage.html">The Box Cinema</a>
        <a href="homePage.html">Home</a>
        <a href="Community.html">Community</a>
        <a href="registrationPage.html">Sign up</a>
    </nav>
</header>
<main>
    <form class="login-box">
        <div class="login-box-inside">
            <h2>Login</h2>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div>
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <div class="remember-me-container">
                <input type="checkbox" id="rememberme">
                <label for="rememberme">Remember me</label>
            </div>
            <button type="submit">Sign in</button>
            <div class="forgot-pass">
                <a href="#">Forgot password?</a>
            </div>
        </div>
    </form>
</main>
<footer>
    <p>&copy; 2026 TheBoxCinema. All rights reserved.</p>
</footer>
</body>
</html>
