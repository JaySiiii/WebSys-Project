<!DOCTYPE html>
<html>
    <meta lang="en">
    <meta charset="utf 8">
    <head>
        <title>The Box Cinema</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="./images/n321bu0os3ttasqngb495pqd6e.png">
    </head>
    <body>
        <header>
            <nav class="navigation_bar">
                <a class="logo-link" href="homePage.html">
                    <img src="./images/n321bu0os3ttasqngb495pqd6e.png" alt="The Box Cinema Logo">
                </a>
                <a id="home-link" href="homePage.html">The Box Cinema</a>
                <a href="homePage.html">Home</a>
                <a href="Community.html">Community</a>
                <a href="logInPage.html">Login</a>
            </nav>
        </header>
        <main>
            <form class="registration-box">
                <div class="registration-box-inside">
                    <h2>Register</h2>
                    <div>
                        <label for="name">Name</label>
                        <input type="name" id="name" required placeholder="Name">
                    </div>
                    <div>
                        <label for="Email">Email</label>
                        <input type="email" id="Email" required placeholder="Email">
                    </div>
                    <div>
                        <label for="Password">Password</label>
                        <input type="password" id="Password" required placeholder="Password">
                    </div>
                    <div>
                        <label for="passwordconfirm">Confirm Password</label>
                        <input type="password" id="passwordconfirm" required placeholder="Confirm Password">
                    </div>
                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <a id="terms-link" href="#">Terms & Conditions</a></label>
                    </div>
                    <button type="submit">Sign up</button>
                    <p >
                        Already have an account? <a id="login-link" href="logInPage.html">Log-in</a>
                    </p>
                </div>
            </form>
        </main>
        <footer>
            <p>
                &copy; 2026 TheBoxCinema. All righs reserved.
            </p>
        </footer>
    </body>
</html>
